<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Awaaz Relay: Government welfare guidance in Tamil, Telugu, Kannada, Hindi and English. Helps frontline workers assist citizens with pension applications." />
    <meta name="theme-color" content="#2e5039" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta property="og:title" content="Awaaz Relay" />
    <meta property="og:description" content="Field Intelligence Copilot for Pension and Welfare Applications" />
    <title>Awaaz Relay — Field Intelligence Copilot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Skip-to-content link — visible only on keyboard focus */
      .skip-link {
        position: absolute;
        top: -48px;
        left: 0;
        background: #2e5039;
        color: #fff;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 6px 0;
        z-index: 9999;
        transition: top 0.15s;
      }
      .skip-link:focus {
        top: 0;
        outline: 3px solid #b5860d;
        outline-offset: 2px;
      }

      /* High-contrast mode support */
      @media (prefers-contrast: more) {
        body { background: #fff; color: #000; }
        button, input, select, textarea { border: 2px solid #000 !important; }
      }

      /* Honour reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Keyboard-navigation skip link -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="root" role="application" aria-label="Awaaz Relay — government welfare guidance tool"></div>

    <!-- Live region for screen reader announcements (populated by JS) -->
    <div
      id="sr-announcements"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
    ></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
