server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──────────────────────────────────────────────────────────
    # All paths fall back to index.html so React Router handles them client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache: hashed assets get a 1-year immutable TTL ─────────────────────
    # Vite appends content hashes to js/css filenames — safe to cache forever
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: index.html must never be cached ───────────────────────────────
    # It references hashed asset filenames; stale index = broken app
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;
}
