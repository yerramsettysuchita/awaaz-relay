services:
  - type: web
    name: awaaz-relay-api
    runtime: python
    pythonVersion: "3.11.0"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: RENDER_EXTERNAL_URL
        value: "https://awaaz-relay-api.onrender.com"
      - key: CORS_ORIGINS
        value: "https://awaaz-relay-m0tz3ff17-yerramsettysuchitas-projects.vercel.app,https://awaaz-relay.vercel.app,https://awaaz-relay-git-master-yerramsettysuchitas-projects.vercel.app"
